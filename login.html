<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBAC Login System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="login-header">
                <h2 id="headerTitle">Welcome Back</h2>
                <p id="headerSubtitle">Sign in to your account</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email" 
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password" 
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="login-btn">
                    <span id="btnText">Sign In</span>
                    <span id="btnLoader" class="loader" style="display: none;"></span>
                </button>

                <div id="message" class="message"></div>
            </form>

            <!-- Sign Up Form -->
            <form id="signupForm" onsubmit="handleSignup(event)" style="display: none;">
                <div class="input-group">
                    <label for="signupEmail">Email Address</label>
                    <input 
                        type="email" 
                        id="signupEmail" 
                        name="signupEmail" 
                        placeholder="Enter your email" 
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="input-group">
                    <label for="signupPassword">Password</label>
                    <input 
                        type="password" 
                        id="signupPassword" 
                        name="signupPassword" 
                        placeholder="Create a password (min. 6 characters)" 
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="Confirm your password" 
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                </div>

                <div class="input-group">
                    <label for="userRole">Role</label>
                    <select id="userRole" name="userRole" required>
                        <option value="">Select a role</option>
                        <option value="participant" selected>Participant</option>
                        <option value="organizer">Organizer</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <button type="submit" class="login-btn">
                    <span id="signupBtnText">Create Account</span>
                    <span id="signupBtnLoader" class="loader" style="display: none;"></span>
                </button>

                <div id="signupMessage" class="message"></div>
            </form>

            <!-- Toggle between Login and Sign Up -->
            <div class="form-toggle">
                <p id="toggleText">Don't have an account? <a href="#" onclick="toggleForm(event)">Sign up</a></p>
            </div>

            <!-- <div class="demo-accounts">
                <p class="demo-title">Demo Accounts:</p>
                <div class="demo-list">
                    <div class="demo-item">
                        <strong>Admin:</strong> admin@example.com / password123
                    </div>
                    <div class="demo-item">
                        <strong>Organizer:</strong> organizer@example.com / password123
                    </div>
                    <div class="demo-item">
                        <strong>Participant:</strong> participant@example.com / password123
                    </div> -->
                </div>
            </div>
        </div>

        <div id="dashboard" class="dashboard" style="display: none;">
            <div class="dashboard-header">
                <h2>Dashboard</h2>
                <button onclick="logout()" class="logout-btn">Logout</button>
            </div>
            <div class="dashboard-content">
                <div class="user-info">
                    <h3>Welcome, <span id="userEmail"></span>!</h3>
                    <div class="role-badge" id="roleBadge"></div>
                </div>
                <div class="role-content" id="roleContent"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
