<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBAC Login System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="login-header">
                <h2>Welcome Back</h2>
                <p>Sign in to your account</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email" 
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password" 
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="login-btn">
                    <span id="btnText">Sign In</span>
                    <span id="btnLoader" class="loader" style="display: none;"></span>
                </button>

                <div id="message" class="message"></div>
            </form>

            <div class="demo-accounts">
                <p class="demo-title">Demo Accounts:</p>
                <div class="demo-list">
                    <div class="demo-item">
                        <strong>Admin:</strong> admin@example.com / password123
                    </div>
                    <div class="demo-item">
                        <strong>Organizer:</strong> organizer@example.com / password123
                    </div>
                    <div class="demo-item">
                        <strong>Participant:</strong> participant@example.com / password123
                    </div>
                </div>
            </div>
        </div>

        <div id="dashboard" class="dashboard" style="display: none;">
            <div class="dashboard-header">
                <h2>Dashboard</h2>
                <button onclick="logout()" class="logout-btn">Logout</button>
            </div>
            <div class="dashboard-content">
                <div class="user-info">
                    <h3>Welcome, <span id="userEmail"></span>!</h3>
                    <div class="role-badge" id="roleBadge"></div>
                </div>
                <div class="role-content" id="roleContent"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
