<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Hub — Sign in</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="login-header">
                <h2 id="headerTitle">Welcome Back</h2>
                <p id="headerSubtitle">Sign in to your account</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email" 
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password" 
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="login-btn">
                    <span id="btnText">Sign In</span>
                    <span id="btnLoader" class="loader" style="display: none;"></span>
                </button>

                <div id="message" class="message"></div>

                <div class="oauth-divider"><span>or</span></div>
                <a class="oauth-btn google" href="/auth/google">
                    <span class="oauth-icon" aria-hidden="true">G</span>
                    Continue with Google
                </a>
            </form>

            <!-- Sign Up Form -->
            <form id="signupForm" onsubmit="handleSignup(event)" style="display: none;">
                <div class="input-group">
                    <label for="signupEmail">Email Address</label>
                    <input 
                        type="email" 
                        id="signupEmail" 
                        name="signupEmail" 
                        placeholder="Enter your email" 
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="input-group">
                    <label for="signupPassword">Password</label>
                    <input 
                        type="password" 
                        id="signupPassword" 
                        name="signupPassword" 
                        placeholder="Create a password (min. 6 characters)" 
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="Confirm your password" 
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                </div>

                <div class="input-group">
                    <label for="userRole">Role</label>
                    <select id="userRole" name="userRole" required>
                        <option value="">Select a role</option>
                        <option value="participant" selected>Participant</option>
                        <option value="organizer">Organizer</option>
                    </select>
                </div>

                <button type="submit" class="login-btn">
                    <span id="signupBtnText">Create Account</span>
                    <span id="signupBtnLoader" class="loader" style="display: none;"></span>
                </button>

                <div id="signupMessage" class="message"></div>
            </form>

            <!-- Toggle between Login and Sign Up -->
            <div class="form-toggle">
                <p id="toggleText">Don't have an account? <a href="#" onclick="toggleForm(event)">Sign up</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
